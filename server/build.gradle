plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'WareWise'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.11.0-M2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'warewise.server.Main'
}

dependencies {
    // Not strictly needed for Grizzly (since you won’t deploy to a servlet container),
    // but harmless if some code references servlet APIs.
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')

    // Jersey (JAX-RS)
    implementation('org.glassfish.jersey.core:jersey-server:4.0.0-M1')

    // Embedded HTTP server for Jersey (Grizzly)
    implementation('org.glassfish.jersey.containers:jersey-container-grizzly2-http:4.0.0-M1')

    // JSON
    implementation('org.glassfish.jersey.media:jersey-media-json-jackson:4.0.0-M1') {
        exclude group: 'jakarta.xml.bind'
    }

    // CDI / Weld (if you use it)
    implementation('org.glassfish.jersey.inject:jersey-cdi2-se:4.0.0-M1')
    implementation('org.jboss.weld.se:weld-se-core:6.0.0.Beta1')

    // Your other deps
    implementation("com.zaxxer:HikariCP:5.1.0")
    implementation("de.mkammerer:argon2-jvm:2.12")
    implementation("com.google.code.gson:gson:2.13.1")
    implementation("com.sun.mail:jakarta.mail:2.0.1")
    implementation("jakarta.ejb:jakarta.ejb-api:4.0.1")
    implementation("io.jsonwebtoken:jjwt-impl:0.11.5")
    implementation("io.jsonwebtoken:jjwt-jackson:0.11.5")
    implementation('org.postgresql:postgresql:42.7.3')
    implementation('jakarta.xml.bind:jakarta.xml.bind-api:4.0.2')
    implementation('org.glassfish.jaxb:jaxb-runtime:4.0.5')
    implementation 'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:2.17.1'



    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}

// Make the fat jar the main build artifact and add manifest Main-Class
tasks.named('shadowJar') {
    archiveClassifier.set('all')
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
