plugins {
  id 'java'
  id 'application'
  id 'org.javamodularity.moduleplugin' version '1.8.12'
  id 'org.openjfx.javafxplugin' version '0.0.13'
  id 'org.beryx.jlink' version '2.25.0'
}

group 'com.warewise.gui'
version '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.10.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

application {
  mainModule = 'com.warewise.gui.controller'
  mainClass = 'com.warewise.gui.App'
}

javafx {
  version = '17.0.6'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
  // https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp
  implementation("com.squareup.okhttp3:okhttp:5.1.0")
  // https://mvnrepository.com/artifact/com.google.code.gson/gson
  implementation("com.google.code.gson:gson:2.13.1")
  implementation 'org.controlsfx:controlsfx:11.1.2'
  // https://mvnrepository.com/artifact/org.jfxtras/jmetro
  implementation 'org.jfxtras:jmetro:11.6.16'
  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
useJUnitPlatform()}

tasks.named('processResources') {
  from("${projectDir}/../images") {
    into 'images'
  }
}

tasks.register('fatJar', Jar) {
  group = 'build'
  description = 'Builds a runnable jar with the GUI runtime dependencies bundled.'
  archiveClassifier = 'all'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  manifest {
    attributes 'Main-Class': application.mainClass.get()
  }

  exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

  from sourceSets.main.output
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
}

jlink {
  imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
  options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
  launcher {
    name = 'app'
  }
}

jlinkZip {
  group = 'distribution'
}
